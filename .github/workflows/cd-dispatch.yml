name: CD - Trigger Infra Deploy (Node Services)

on:
  push:
    branches:
      - deploy
    paths:
      - 'apps/bidding/**'
      - 'apps/notification/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'nest-cli.json'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  dispatch-deploy:
    name: Dispatch Changed Node Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed apps & dispatch deploy to backhaulbid-infrastructure
        env:
          INFRA_DISPATCH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          EVENT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "${INFRA_DISPATCH_TOKEN}" ]]; then
            echo "::error::Missing secret INFRA_DISPATCH_TOKEN (Fine-grained PAT with Contents: Read and write on Phucvinh0411/backhaulbid-infrastructure)."
            exit 1
          fi

          ALL_NODE="bidding-service,notification-service"
          SERVICES=""

          if [[ -z "${EVENT_BEFORE}" || "${EVENT_BEFORE}" == "0000000000000000000000000000000000000000" ]] \
            || ! git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            SERVICES="${ALL_NODE}"
          else
            CHANGED="$(git diff --name-only "${EVENT_BEFORE}" "${EVENT_SHA}")"
            if printf '%s\n' "${CHANGED}" | grep -qE '^(Dockerfile|package\.json|package-lock\.json|nest-cli\.json|tsconfig.*\.json)$'; then
              SERVICES="${ALL_NODE}"
            else
              if printf '%s\n' "${CHANGED}" | grep -q '^apps/bidding/'; then
                SERVICES="bidding-service"
              fi
              if printf '%s\n' "${CHANGED}" | grep -q '^apps/notification/'; then
                SERVICES="${SERVICES:+${SERVICES},}notification-service"
              fi
            fi
          fi

          if [[ -z "${SERVICES}" ]]; then
            echo "No Node service apps changed; skipping deploy dispatch."
            exit 0
          fi

          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "Dispatching services=${SERVICES}, image_tag=${SHORT_SHA}, source_branch=deploy"

          curl -sS --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${INFRA_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Phucvinh0411/backhaulbid-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy-services\",\"client_payload\":{\"services\":\"${SERVICES}\",\"image_tag\":\"${SHORT_SHA}\",\"source_branch\":\"deploy\",\"triggered_by\":\"${REPO_NAME}@${SHORT_SHA}\"}}"
